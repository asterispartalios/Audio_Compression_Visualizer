name: Build portable Windows and macOS apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-Portable-EXE
          path: dist/*.exe
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: arm
            command: build:mac:arm
          - arch: intel
            command: build:mac:intel
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}-APP
          path: dist/*.zip
          if-no-files-found: error
