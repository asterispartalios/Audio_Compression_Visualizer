<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Audio Compression Visualizer</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script><script src="knobs.js" defer></script></head><body><div id="wrap"><div class="wave-panel"><canvas id="waveform" width="900" height="500"></canvas></div><div id="controls"><div class="faceplate-title"><span class="faceplate-mark"></span><span>Audio Compression Visualizer</span><span class="faceplate-rule"></span><small>ANALOG DYNAMICS · VISUAL SIMULATOR</small></div><div class="controls-row"><div class="control"><label for="thresh_text">Threshold</label><div class="knob" tabindex="0" role="slider" aria-label="Threshold" aria-valuemin="-60" aria-valuemax="0" aria-valuenow="0" data-target="thresh_text"><div class="knob-face"><span class="knob-indicator"></span></div></div><output id="thresh_text_display">0dB</output><input type="range" id="thresh_text" value="0" min="-60" max="0" step="0.1" oninput="compress()" aria-hidden="true" tabindex="-1" data-unit="dB"></div><div class="control"><label for="ratio_text">Ratio</label><div class="knob" tabindex="0" role="slider" aria-label="Ratio" aria-valuemin="1" aria-valuemax="100" aria-valuenow="1" data-target="ratio_text"><div class="knob-face"><span class="knob-indicator"></span></div></div><output id="ratio_text_display">1:1</output><input type="range" id="ratio_text" value="1" min="1" max="100" step="1" oninput="compress()" aria-hidden="true" tabindex="-1" data-unit=":1"></div><div class="control"><label for="atk_text">Attack</label><div class="knob" tabindex="0" role="slider" aria-label="Attack" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" data-target="atk_text"><div class="knob-face"><span class="knob-indicator"></span></div></div><output id="atk_text_display">50ms</output><input type="range" id="atk_text" value="50" min="0" max="100" step="1" oninput="compress()" aria-hidden="true" tabindex="-1" data-unit="ms"></div><div class="control"><label for="rel_text">Release</label><div class="knob" tabindex="0" role="slider" aria-label="Release" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" data-target="rel_text"><div class="knob-face"><span class="knob-indicator"></span></div></div><output id="rel_text_display">50ms</output><input type="range" id="rel_text" value="50" min="0" max="100" step="1" oninput="compress()" aria-hidden="true" tabindex="-1" data-unit="ms"></div><div class="control"><label for="gain_text">Makeup Gain</label><div class="knob" tabindex="0" role="slider" aria-label="Makeup Gain" aria-valuemin="0" aria-valuemax="24" aria-valuenow="0" data-target="gain_text"><div class="knob-face"><span class="knob-indicator"></span></div></div><output id="gain_text_display">0dB</output><input type="range" id="gain_text" value="0" min="0" max="24" step="0.1" oninput="compress()" aria-hidden="true" tabindex="-1" data-unit="dB"></div></div></div></div></body></html>
